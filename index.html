<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вероятностный поход</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🎲 Вероятностный поход</h1><div id="stats"></div></header>
<main>
<section class="card"><h2>Локация</h2><div id="locs" class="row"></div><div id="risk"></div></section>
<section class="card"><h2>Распределение фишек <span id="chipinfo"></span></h2>
<div class="hint">Каждая фишка — независимое испытание на ярусе. Ярус 10 — единственный источник легендарок; провал на нём даёт осколок.</div>
<div id="tiers"></div><div class="row"><button id="go" class="big">⚔️ В поход</button><button id="clear">Сбросить</button><button id="opt">Жадный оптимум</button></div></section>
<section class="card" id="reportCard" hidden><h2>Итоги похода</h2><div id="report"></div></section>
<section class="card"><h2>Герой</h2><div id="hero"></div></section>
<section class="card"><h2>Инвентарь</h2><div class="row"><button id="autoeq">Надеть лучшее</button><button id="disAll">Разобрать всё</button></div><div id="inv"></div></section>
<section class="card"><h2>Лавка</h2><div id="shop" class="row"></div></section>
<footer><button id="reset" class="danger">Сбросить прогресс</button></footer>
</main><script src="logic.js"></script><script src="app.js"></script></body></html>
