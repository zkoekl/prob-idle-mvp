<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вероятностный поход</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🎲 Вероятностный поход</h1><div id="stats"></div></header>
<main>
<div id="win" class="card winc" hidden>🏆 Бездна Удачи покорена! Вы прошли игру. Можно продолжать охоту за легендарками.</div>
<section class="card"><div id="hero"></div></section>
<section class="card" id="runCard"><div id="run"></div></section>
<section class="card" id="reportCard" hidden><h2>Добыча</h2><div id="report"></div></section>
<section class="card" id="montyCard" hidden><h2>🎁 Сундуки и проводник</h2><div id="monty"></div></section>
<section class="card" id="mimicCard" hidden><h2>👀 Подозрительный сундук</h2><div id="mimic"></div></section>
<section class="card" id="chipCard" hidden><h2>🎲 Фишки удачи <span id="chipinfo"></span> <span class="tip" data-tip="chips">ⓘ</span></h2><div id="chips"></div>
 <div id="evalBox" hidden><div class="row"><button id="evalb">📊 Оценить (2000 симуляций)</button></div><div id="eval"></div></div></section>
<section class="card" id="locCard" hidden><h2>Локации <span class="tip" data-tip="locs">ⓘ</span></h2><div id="locs" class="locgrid"></div></section>
<section class="card" id="guidesCard" hidden><h2>🧭 Проводники <span class="tip" data-tip="variants">ⓘ</span></h2><div id="guides"></div></section>
<section class="card" id="setsCard" hidden><h2>🏺 Коллекции трофеев</h2><div id="sets"></div></section>
<section class="card" id="statsCard" hidden><h2>📈 Статистика удачи</h2><div id="stats2"></div></section>
<section class="card"><h2>Инвентарь</h2><div class="row"><button id="autoeq">Надеть лучшее</button><button id="autosell" hidden></button><button id="disAll" hidden>Продать всё, что хуже надетого</button></div><div id="inv"></div></section>
<section class="card" id="shopCard" hidden><h2>Лавка <span class="tip" data-tip="shop">ⓘ</span></h2><div id="shop" class="shopgrid"></div></section>
<section class="card"><details><summary><b>📖 Как это работает</b></summary><div id="howto"></div></details></section>
<footer><button id="reset" class="danger">Сбросить прогресс</button></footer>
</main><div id="modal" hidden><div class="mbox"><div id="mtext"></div><button id="mok" class="big">Понятно</button></div></div>
<script src="art.js"></script><script src="help.js"></script><script src="logic.js"></script><script src="app.js"></script></body></html>
